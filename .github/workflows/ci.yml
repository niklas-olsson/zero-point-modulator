name: Test repository capacity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -v
      - run: python -m pip install --no-deps .
      - run: zpm --help
      - run: zpm validate examples/repository.json

  shared-lifecycle:
    name: OpenJules lifecycle contract
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Update this immutable pin with docs/http-contract-trial.md.
          ref: 0dd5bf4e42b3677c3f2f564655bc87a97c4bf973
          path: .contract/OpenJules
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record ZPM revision
        run: git rev-parse HEAD
      - name: Record OpenJules revision
        run: git -C .contract/OpenJules rev-parse HEAD
      - name: Install contract trial dependencies
        run: python -m pip install "fastapi>=0.110.0" "uvicorn>=0.28.0" "httpx>=0.27.0" "docker>=7.0.0" "pyyaml>=6.0.1" "cryptography>=42.0.0" "pytest>=7"
      - name: Verify the shared lifecycle contract
        run: python tests/contracts/check_openjules.py --openjules-checkout .contract/OpenJules
      - name: Verify scoped producer diagnostics with the actual HTTP consumer
        run: python tests/contracts/check_capability_diagnostics.py --openjules-checkout .contract/OpenJules

  managed-stack:
    name: Install and verify the managed stack
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Sibling checkouts preserve each repository's clean-tree invariant.
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Merged managed-public runtime, shared by every integration gate.
          # Update this pin with docs/managed-stack-trial.md.
          ref: 0dd5bf4e42b3677c3f2f564655bc87a97c4bf973
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          # Same merged initial-outcome authority in every installed-stack gate.
          ref: 6480e36355bf0d5de4e25a560d40e665fd76038c
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the local Docker Engine
        run: docker info
      - name: Build and identify the controlled trial image
        run: docker build --iidfile "$RUNNER_TEMP/managed-trial-image.id" - < zpm/tests/contracts/Dockerfile.managed-trial
      - name: Prepare, bootstrap and verify actual managed services
        run: |
          python zpm/tests/contracts/check_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-trial-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-stack-trial"
      - name: Install locked native discussion dependencies through the fixed PATH
        run: |
          env PATH=/usr/local/bin:/usr/bin:/bin node --version
          env PATH=/usr/local/bin:/usr/bin:/bin npm ci --prefix polyphony/src/liminal_bridge/sidecar
      - name: Verify independent public peers through the retained installed interpreters
        run: |
          python zpm/tests/contracts/check_public_discussion_stack.py \
            --managed-stack-dir "$RUNNER_TEMP/managed-stack-trial" \
            --work-dir "$RUNNER_TEMP/public-discussion-trial"
      - name: Retain only the credential-free verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-stack-evidence
          path: |
            ${{ runner.temp }}/managed-stack-trial/report.json
            ${{ runner.temp }}/managed-stack-trial/diagnostics.json
            ${{ runner.temp }}/public-discussion-trial/report.json
            ${{ runner.temp }}/public-discussion-trial/diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  native-musl-preparation:
    name: Qualify native musl atomic preparation on ext2 and ext4
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify closed Alpine inputs and native preparation recovery
        run: |
          python -I -B tests/contracts/check_musl_preparation.py \
            --inputs tests/contracts/musl-preparation-inputs.json \
            --work-dir "$RUNNER_TEMP/native-musl-preparation"
      - name: Retain only the safe native primitive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-musl-preparation-evidence
          path: ${{ runner.temp }}/native-musl-preparation/report.json
          if-no-files-found: warn
          retention-days: 14

  sealed-managed-stack:
    name: Bootstrap sealed Python artifacts with package networking denied
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Same qualified producer as the ordinary installed stack.
          ref: 0dd5bf4e42b3677c3f2f564655bc87a97c4bf973
          path: openjules
          persist-credentials: false
          # The producer's approved helpers and recipe have separate Git pins.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          ref: 6480e36355bf0d5de4e25a560d40e665fd76038c
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the local Docker Engine
        run: docker info
      - name: Acquire explicit finite test inputs before bootstrap
        run: |
          python zpm/tests/contracts/prepare_dependencies.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --work-dir "$RUNNER_TEMP/sealed-python-inputs"
      - name: Build and qualify the finite OpenJules managed image
        working-directory: openjules
        run: |
          sudo env PATH="$PATH" "$(command -v python)" -B -m tools.managed_image build \
            --approved-inputs docker/managed-image-inputs.json \
            --approved-inputs-sha256 sha256:dc588f1eaff9b6e73fd94f90690cf67f5dd9ef23e39f722a98d09e5b373ec644 \
            --approved-qualification docker/managed-image-qualification.json \
            --approved-qualification-sha256 sha256:def63e03d458fc0a15991a98dbce67c0ddc7e83c2898f61d5bb3f78cc33b073d \
            --output "$RUNNER_TEMP/sealed-managed-image"
      - name: Verify the producer archive and import its exact image
        working-directory: openjules
        run: |
          artifact_sha256=$(sudo sha256sum "$RUNNER_TEMP/sealed-managed-image/artifact.json" | cut -d ' ' -f 1)
          sudo env PATH="$PATH" "$(command -v python)" -B -m tools.managed_image verify \
            --archive "$RUNNER_TEMP/sealed-managed-image/managed-agent.docker.tar" \
            --record "$RUNNER_TEMP/sealed-managed-image/artifact.json" \
            --record-sha256 "sha256:$artifact_sha256" \
            > "$RUNNER_TEMP/sealed-managed-image-verification.json"
          sudo docker image load --input "$RUNNER_TEMP/sealed-managed-image/managed-agent.docker.tar"
          python - "$RUNNER_TEMP/sealed-managed-image-verification.json" "$RUNNER_TEMP/sealed-trial-image.id" <<'PY'
          import json, pathlib, sys
          record = json.loads(pathlib.Path(sys.argv[1]).read_text())
          pathlib.Path(sys.argv[2]).write_text(record["image_id"] + "\n")
          PY
      - name: Bootstrap without IP networking and run the canonical retained-work trial
        run: |
          python zpm/tests/contracts/check_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/sealed-trial-image.id")" \
            --dependency-plan "$RUNNER_TEMP/sealed-python-inputs/reference.json" \
            --deny-bootstrap-network \
            --work-dir "$RUNNER_TEMP/sealed-managed-stack-trial"
      - name: Stage the producer's named safe metadata
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed-managed-image-evidence"
          for name in inputs.json artifact.json archive-inventory.json acquisition-report.json resource-report.json apt-verification.txt context.json build.log native-tests.txt failed-command.txt; do
            if sudo test -f "$RUNNER_TEMP/sealed-managed-image/$name"; then
              sudo install -m 0644 "$RUNNER_TEMP/sealed-managed-image/$name" "$RUNNER_TEMP/sealed-managed-image-evidence/$name"
            fi
          done
      - name: Retain only credential-free acquisition and installed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-managed-stack-evidence
          path: |
            ${{ runner.temp }}/sealed-python-inputs/acquisition-report.json
            ${{ runner.temp }}/sealed-python-inputs/dependencies.json
            ${{ runner.temp }}/sealed-managed-image-evidence/
            ${{ runner.temp }}/sealed-managed-image-verification.json
            ${{ runner.temp }}/sealed-managed-stack-trial/report.json
            ${{ runner.temp }}/sealed-managed-stack-trial/diagnostics.json
            ${{ runner.temp }}/sealed-managed-stack-trial/*-network.json
          if-no-files-found: warn
          retention-days: 14

  managed-isolation-stack:
    name: Install and isolate two deployments on one Docker Engine
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Same merged managed-public runtime as every other integration gate.
          # Update this pin with docs/managed-isolation-stack-trial.md.
          ref: 0dd5bf4e42b3677c3f2f564655bc87a97c4bf973
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          ref: 6480e36355bf0d5de4e25a560d40e665fd76038c
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the shared Docker Engine
        run: docker info
      - name: Build one immutable controlled trial image
        run: docker build --iidfile "$RUNNER_TEMP/isolation-image.id" - < zpm/tests/contracts/Dockerfile.managed-trial
      - name: Prepare two bundles and exercise concurrent isolation
        run: |
          python zpm/tests/contracts/check_isolation_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/isolation-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-isolation-trial"
      - name: Retain only aggregate isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-isolation-evidence
          path: |
            ${{ runner.temp }}/managed-isolation-trial/report.json
            ${{ runner.temp }}/managed-isolation-trial/diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  managed-multi-repository-stack:
    name: Install two repositories behind one controller and service pair
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Same merged managed-public runtime as every other integration gate.
          # Update with docs/managed-multi-repository-stack-trial.md.
          ref: 0dd5bf4e42b3677c3f2f564655bc87a97c4bf973
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          ref: 6480e36355bf0d5de4e25a560d40e665fd76038c
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the shared Docker Engine
        run: docker info
      - name: Build the immutable controlled trial image
        run: docker build --iidfile "$RUNNER_TEMP/multi-repository-image.id" - < zpm/tests/contracts/Dockerfile.managed-trial
      - name: Prepare one bundle and exercise shared capacity and scoped recovery
        run: |
          python zpm/tests/contracts/check_multi_repository_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/multi-repository-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-multi-repository-trial"
      - name: Retain only aggregate shared-service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-multi-repository-evidence
          path: |
            ${{ runner.temp }}/managed-multi-repository-trial/report.json
            ${{ runner.temp }}/managed-multi-repository-trial/diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  managed-children-stack:
    name: Install and verify two children inside one worker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Merged managed-public runtime, shared by every integration gate.
          # Update this pin with docs/managed-children-stack-trial.md.
          ref: 0dd5bf4e42b3677c3f2f564655bc87a97c4bf973
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          # Same merged initial-outcome authority in every installed-stack gate.
          ref: 6480e36355bf0d5de4e25a560d40e665fd76038c
          path: polyphony
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          # Negative evidence only: genuine prior revision lacks initial child outcomes.
          # The operative authority remains the positive pin above.
          ref: 473df5a0406accfe5cb550877e7b28a602cb116c
          path: polyphony-historical
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the local Docker Engine
        run: docker info
      - name: Build the real managed root and child agent image
        run: |
          docker build --build-arg PYTHON_BASE=python:3.12-slim \
            --iidfile "$RUNNER_TEMP/managed-children-image.id" \
            -f openjules/docker/Dockerfile.managed-agent openjules
      - name: Install and exercise canonical child delegation and capture
        run: |
          python zpm/tests/contracts/check_children_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-children-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-children-stack-trial"
      - name: Install and recover explicit child completion and decline
        run: |
          python zpm/tests/contracts/check_children_stack.py \
            --initial-outcomes \
            --historical-polyphony-checkout "$GITHUB_WORKSPACE/polyphony-historical" \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-children-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-child-outcomes-trial"
      - name: Install and verify two cold clarification rounds
        run: |
          python zpm/tests/contracts/check_cold_children_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-children-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-cold-children-trial"
      - name: Install and recover an acknowledged failed child outcome
        run: |
          python zpm/tests/contracts/check_children_stack.py \
            --initial-outcomes \
            --right-outcome failed \
            --historical-polyphony-checkout "$GITHUB_WORKSPACE/polyphony-historical" \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-children-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-child-failed-outcome-trial"
      - name: Install locked native discussion dependencies through the fixed PATH
        run: |
          env PATH=/usr/local/bin:/usr/bin:/bin node --version
          env PATH=/usr/local/bin:/usr/bin:/bin npm ci --prefix polyphony/src/liminal_bridge/sidecar
      - name: Install and verify private work with managed public discussion
        run: |
          python zpm/tests/contracts/check_managed_public_stack.py \
            --managed-stack-dir "$RUNNER_TEMP/managed-child-failed-outcome-trial" \
            --image "$(cat "$RUNNER_TEMP/managed-children-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-public-discussion-trial"
      - name: Retain only the credential-free child trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-children-stack-evidence
          path: |
            ${{ runner.temp }}/managed-children-stack-trial/report.json
            ${{ runner.temp }}/managed-children-stack-trial/diagnostics.json
            ${{ runner.temp }}/managed-child-outcomes-trial/report.json
            ${{ runner.temp }}/managed-child-outcomes-trial/diagnostics.json
            ${{ runner.temp }}/managed-cold-children-trial/report.json
            ${{ runner.temp }}/managed-cold-children-trial/diagnostics.json
            ${{ runner.temp }}/managed-child-failed-outcome-trial/report.json
            ${{ runner.temp }}/managed-child-failed-outcome-trial/diagnostics.json
            ${{ runner.temp }}/managed-public-discussion-trial/report.json
            ${{ runner.temp }}/managed-public-discussion-trial/diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  managed-model-stack:
    name: Install and verify the model-backed root agent
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Merged managed-public runtime, shared by every integration gate.
          # Update this pin with docs/managed-model-stack-trial.md.
          ref: 0dd5bf4e42b3677c3f2f564655bc87a97c4bf973
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          ref: 6480e36355bf0d5de4e25a560d40e665fd76038c
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the local Docker Engine
        run: docker info
      - name: Build the real managed coding-agent image
        run: |
          docker build --build-arg PYTHON_BASE=python:3.12-slim \
            --iidfile "$RUNNER_TEMP/managed-model-image.id" \
            -f openjules/docker/Dockerfile.managed-agent openjules
      - name: Install and exercise canonical model-backed root coding
        run: |
          python zpm/tests/contracts/check_model_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-model-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-model-stack-trial"
      - name: Run the complete public-source suite in the pinned confined runtime
        run: |
          "$RUNNER_TEMP/managed-model-stack-trial/installation/environments/openjules/bin/python" \
            zpm/tests/contracts/check_confined_suite.py \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-model-image.id")" \
            --work-dir "$RUNNER_TEMP/confined-suite-trial"
      - name: Retain only the credential-free model trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-model-stack-evidence
          path: |
            ${{ runner.temp }}/managed-model-stack-trial/report.json
            ${{ runner.temp }}/managed-model-stack-trial/diagnostics.json
            ${{ runner.temp }}/confined-suite-trial/report.json
          if-no-files-found: warn
          retention-days: 14
