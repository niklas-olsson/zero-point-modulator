name: Test repository capacity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -v
      - run: python -m pip install --no-deps .
      - run: zpm --help
      - run: zpm validate examples/repository.json

  shared-lifecycle:
    name: OpenJules lifecycle contract
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Update this immutable pin with docs/http-contract-trial.md.
          ref: cf079b90ee081e84b29b6179ad1aaebdb8156365
          path: .contract/OpenJules
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record ZPM revision
        run: git rev-parse HEAD
      - name: Record OpenJules revision
        run: git -C .contract/OpenJules rev-parse HEAD
      - name: Install contract trial dependencies
        run: python -m pip install "fastapi>=0.110.0" "uvicorn>=0.28.0"
      - name: Verify the shared lifecycle contract
        run: python tests/contracts/check_openjules.py --openjules-checkout .contract/OpenJules

  managed-stack:
    name: Install and verify the managed stack
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Sibling checkouts preserve each repository's clean-tree invariant.
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Merged PR12 revision, shared by every integration gate.
          # Update this pin with docs/managed-stack-trial.md.
          ref: cf079b90ee081e84b29b6179ad1aaebdb8156365
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          # Same merged Polyphony revision in every installed-stack gate.
          ref: 473df5a0406accfe5cb550877e7b28a602cb116c
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the local Docker Engine
        run: docker info
      - name: Build and identify the controlled trial image
        run: docker build --iidfile "$RUNNER_TEMP/managed-trial-image.id" - < zpm/tests/contracts/Dockerfile.managed-trial
      - name: Prepare, bootstrap and verify actual managed services
        run: |
          python zpm/tests/contracts/check_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-trial-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-stack-trial"
      - name: Retain only the credential-free verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-stack-evidence
          path: |
            ${{ runner.temp }}/managed-stack-trial/report.json
            ${{ runner.temp }}/managed-stack-trial/diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  managed-children-stack:
    name: Install and verify two children inside one worker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Merged PR12 revision, shared by every integration gate.
          # Update this pin with docs/managed-children-stack-trial.md.
          ref: cf079b90ee081e84b29b6179ad1aaebdb8156365
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          # Same merged Polyphony revision in every installed-stack gate.
          ref: 473df5a0406accfe5cb550877e7b28a602cb116c
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the local Docker Engine
        run: docker info
      - name: Build the real managed root and child agent image
        run: |
          docker build --build-arg PYTHON_BASE=python:3.12-slim \
            --iidfile "$RUNNER_TEMP/managed-children-image.id" \
            -f openjules/docker/Dockerfile.managed-agent openjules
      - name: Install and exercise canonical child delegation and capture
        run: |
          python zpm/tests/contracts/check_children_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-children-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-children-stack-trial"
      - name: Retain only the credential-free child trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-children-stack-evidence
          path: |
            ${{ runner.temp }}/managed-children-stack-trial/report.json
            ${{ runner.temp }}/managed-children-stack-trial/diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  managed-model-stack:
    name: Install and verify the model-backed root agent
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          # Merged PR12 revision, shared by every integration gate.
          # Update this pin with docs/managed-model-stack-trial.md.
          ref: cf079b90ee081e84b29b6179ad1aaebdb8156365
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          ref: 473df5a0406accfe5cb550877e7b28a602cb116c
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the local Docker Engine
        run: docker info
      - name: Build the real managed coding-agent image
        run: |
          docker build --build-arg PYTHON_BASE=python:3.12-slim \
            --iidfile "$RUNNER_TEMP/managed-model-image.id" \
            -f openjules/docker/Dockerfile.managed-agent openjules
      - name: Install and exercise canonical model-backed root coding
        run: |
          python zpm/tests/contracts/check_model_stack.py \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-model-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-model-stack-trial"
      - name: Retain only the credential-free model trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-model-stack-evidence
          path: |
            ${{ runner.temp }}/managed-model-stack-trial/report.json
            ${{ runner.temp }}/managed-model-stack-trial/diagnostics.json
          if-no-files-found: warn
          retention-days: 14
