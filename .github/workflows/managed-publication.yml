name: Managed publication qualification

# This workflow creates one real draft PR. Merge and review this infrastructure
# before a maintainer manually dispatches the default-branch revision.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-publication-qualification
  cancel-in-progress: false

jobs:
  managed-publication:
    name: Produce and replay one actual managed draft
    if: github.repository_id == '1453104676' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: zpm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/OpenJules
          ref: a1547a7743996d2db9866013135e5adb75c0ec7c
          path: openjules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niklas-olsson/keystone-polyphony
          ref: dc18c3fb585e00a90706b04095bc278ee3ff1106
          path: polyphony
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the actual local Docker Engine
        run: docker info
      - name: Build the approved managed root and child image
        run: |
          docker build --build-arg PYTHON_BASE=python:3.12-slim \
            --iidfile "$RUNNER_TEMP/managed-publication-image.id" \
            -f openjules/docker/Dockerfile.managed-agent openjules
      - name: Execute genuine parent and children without a forge credential
        run: |
          python zpm/tests/contracts/check_publication_stack.py execute \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --image "$(cat "$RUNNER_TEMP/managed-publication-image.id")" \
            --work-dir "$RUNNER_TEMP/managed-publication-trial"
      - name: Publish and replay from the original private captures
        env:
          # Only this trusted phase receives the forge credential. It does not
          # start the model, managed runtime, controller or any guest.
          GITHUB_PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          python zpm/tests/contracts/check_publication_stack.py publish \
            --polyphony-checkout "$GITHUB_WORKSPACE/polyphony" \
            --openjules-checkout "$GITHUB_WORKSPACE/openjules" \
            --work-dir "$RUNNER_TEMP/managed-publication-trial"
      - name: Retain only safe aggregate publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-publication-evidence
          path: |
            ${{ runner.temp }}/managed-publication-trial/execution-report.json
            ${{ runner.temp }}/managed-publication-trial/publication-report.json
            ${{ runner.temp }}/managed-publication-trial/failure-report.json
          if-no-files-found: warn
          retention-days: 14
